<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIRE Attendance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .meeting {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      color: #374151;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 20px;
      font-weight: 600;
      color: #16a34a;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">A</div>

    <h1>ASPIRE Association</h1>

    <p class="subtitle">Attendance System</p>

    <div class="meeting">
      ASPIRE Test Meeting
    </div>

    <input
      type="text"
      placeholder="Enter your name"
      id="name"
    >

    <button onclick="markAttendance()">
      Mark Attendance
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
      ASPIRE Association
    </div>

  </div>

  <script>
    function markAttendance() {

      const name = document.getElementById("name").value.trim();

      if (name === "") {
        document.getElementById("status").style.color = "#dc2626";
        document.getElementById("status").innerText =
          "Please enter your name.";
        return;
      }

      document.getElementById("status").style.color = "#16a34a";
      document.getElementById("status").innerText =
        "✓ Attendance marked successfully!";
    }
  </script>

</body>
</html>
