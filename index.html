<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIRE Attendance</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .meeting {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      color: #374151;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      font-weight: 600;
      min-height: 20px;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">A</div>

    <h1>ASPIRE Association</h1>

    <p class="subtitle">Attendance System</p>

    <div class="meeting" id="meeting">
      Loading meeting...
    </div>

    <input
      type="text"
      placeholder="Enter your name"
      id="name"
      autocomplete="name"
    >

    <button id="attendanceButton" onclick="markAttendance()">
      Mark Attendance
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
      ASPIRE Association
    </div>

  </div>

  <script>

    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    const SUPABASE_URL = "https://ruscrtdlhincwkuwbqpl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SCKiz4jx6wKnFr-vD8gPQQ_9KBeQZgP";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =====================================================
       GET MEETING ID
       
       For our first test:
       meeting ID = 1

       Later, QR codes will automatically provide
       the correct meeting.
       ===================================================== */

    const urlParams = new URLSearchParams(window.location.search);

const qrToken = urlParams.get("token");

let meetingId = null;


    /* =====================================================
       LOAD MEETING
       ===================================================== */

    async function loadMeeting() {

      const meetingBox =
        document.getElementById("meeting");

      const { data, error } =
        await supabaseClient
          .from("meetings")
          .select("id, title, meeting_date, is_open")
          .eq("id", meetingId)
          .single();

      if (error || !data) {

        meetingBox.innerText =
          "Meeting not found.";

        document.getElementById("attendanceButton").disabled = true;

        return;
      }

      if (!data.is_open) {

        meetingBox.innerText =
          data.title + " — Attendance Closed";

        document.getElementById("attendanceButton").disabled = true;

        return;
      }

      meetingBox.innerText =
        data.title;
    }


    /* =====================================================
       MARK ATTENDANCE
       ===================================================== */

    async function markAttendance() {

      const nameInput =
        document.getElementById("name");

      const status =
        document.getElementById("status");

      const button =
        document.getElementById("attendanceButton");

      const name =
        nameInput.value.trim();


      /* Empty name */

      if (name === "") {

        status.style.color = "#dc2626";

        status.innerText =
          "Please enter your name.";

        return;
      }


      /* Disable button while processing */

      button.disabled = true;

      button.innerText =
        "Checking...";

      status.style.color = "#6b7280";

      status.innerText =
        "Checking your name...";


      try {

        /* =================================================
           CHECK MEETING
           ================================================= */

        const { data: meeting, error: meetingError } =
          await supabaseClient
            .from("meetings")
            .select("id, title, is_open")
            .eq("id", meetingId)
            .single();


        if (meetingError || !meeting) {

          throw new Error(
            "Meeting not found."
          );
        }


        if (!meeting.is_open) {

          throw new Error(
            "Attendance for this meeting is closed."
          );
        }


        /* =================================================
           FIND MEMBER
           ================================================= */

        const { data: members, error: memberError } =
          await supabaseClient
            .from("members")
            .select("id, name")
            .ilike("name", name);


        if (memberError) {

          throw new Error(
            "Could not check member name."
          );
        }


        if (!members || members.length === 0) {

          throw new Error(
            "Name not found. Please enter your registered ASPIRE name."
          );
        }


        if (members.length > 1) {

          throw new Error(
            "More than one member has this name. Please contact ASPIRE."
          );
        }


        const member =
          members[0];


        /* =================================================
           SAVE ATTENDANCE
           ================================================= */

        const { error: attendanceError } =
          await supabaseClient
            .from("attendance")
            .insert({
              meeting_id: meeting.id,
              member_id: member.id
            });


        /* =================================================
           DUPLICATE ATTENDANCE
           ================================================= */

        if (attendanceError) {

          if (attendanceError.code === "23505") {

            throw new Error(
              "You have already marked attendance for this meeting."
            );
          }

          throw new Error(
            "Could not mark attendance. Please try again."
          );
        }


        /* =================================================
           SUCCESS
           ================================================= */

        status.style.color = "#16a34a";

        status.innerText =
          "✓ Attendance marked successfully!";

        nameInput.value = "";

        button.innerText =
          "Attendance Marked";

      }

      catch (error) {

        status.style.color = "#dc2626";

        status.innerText =
          error.message;

        button.disabled = false;

        button.innerText =
          "Mark Attendance";
      }

    }


    /* =====================================================
       LOAD PAGE
       ===================================================== */

    loadMeeting();

  </script>

</body>
</html>
